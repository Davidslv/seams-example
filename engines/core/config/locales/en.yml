# Engine-scoped i18n. Every translation key SHOULD start with
# `core.` so two engines can never collide on a key (the host's
# I18n.load_path picks up engines/*/config/locales/*.yml automatically
# via Rails::Engine).
#
# Usage from inside the engine:
#
#   I18n.t("core.welcome", name: "Ada")
#
# Override in the host by dropping a file at
# config/locales/core.en.yml — keys merge top-down, host wins.
en:
  core:
    placeholder: "Translate me — engines/core/config/locales/en.yml"
