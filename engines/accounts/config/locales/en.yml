# Engine-scoped i18n. Every translation key SHOULD start with
# `accounts.` so two engines can never collide on a key (the host's
# I18n.load_path picks up engines/*/config/locales/*.yml automatically
# via Rails::Engine).
#
# Usage from inside the engine:
#
#   I18n.t("accounts.welcome", name: "Ada")
#
# Override in the host by dropping a file at
# config/locales/accounts.en.yml — keys merge top-down, host wins.
en:
  accounts:
    placeholder: "Translate me — engines/accounts/config/locales/en.yml"
